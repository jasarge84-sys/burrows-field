name: Update fixtures

# Manual only for now: FA Full-Time refuses requests from GitHub's servers (HTTP 403, tested 20 Oct 2026).
# The page loads the club's code snippet live in each visitor's browser instead.
# To try a scheduled refresh again, add back:
#   schedule:
#     - cron: "30 17 * * 1,5"   # Mondays and Fridays, 17:30 UTC
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-fixtures
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3

      - name: Fetch fixtures from FA Full-Time
        run: python scripts/update.py

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add fixtures.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update fixtures $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
